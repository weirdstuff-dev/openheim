name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Feature matrix: the lib must stay buildable without the CLI/TUI/server deps.
      # --all-targets also compiles the unit tests without default features
      # (the e2e suite is skipped: it requires `cli`).
      - run: cargo clippy --no-default-features --all-targets -- -D warnings
      - run: cargo clippy --no-default-features --features tui -- -D warnings
      - run: cargo clippy --no-default-features --features server -- -D warnings
      # Doc comments are published on docs.rs — broken/dead intra-doc links
      # must fail CI, across the same feature matrix as clippy above.
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-default-features --no-deps
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-default-features --features tui --no-deps
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-default-features --features server --no-deps

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      # Unit tests plus the black-box suite in tests/e2e, which builds and
      # drives the openheim binary.
      - run: cargo test
