[package]
name = "openheim"
version = "0.6.0"
edition = "2024"
description = "A fast, multi-provider LLM agent runtime written in Rust"
license = "MIT"
repository = "https://github.com/weirdstuff-dev/openheim"
homepage = "https://openheim.io"
documentation = "https://docs.rs/openheim"
keywords = ["agent", "llm", "ai", "mcp", "async"]
categories = ["command-line-utilities", "asynchronous"]
rust-version = "1.91"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "openheim"
path = "src/lib.rs"

[[bin]]
name = "openheim"
path = "src/main.rs"
required-features = ["cli"]

[features]
# Defaults keep the pre-feature behavior: `cargo build` / `cargo install openheim`
# produce the full binary. Library embedders use `default-features = false`.
default = ["cli"]
# The `openheim` binary: CLI parsing + everything it can reach.
cli = ["dep:clap", "dep:tracing-subscriber", "server", "tui"]
# Terminal UI (`openheim::tui`).
tui = ["dep:crossterm", "dep:futures", "dep:ratatui"]
# WebSocket/REST server (`openheim::transport::ws`).
server = ["dep:axum", "dep:futures", "dep:notify", "dep:tower-http", "dep:walkdir"]

[dependencies]
clap = { version = "4.5.54", features = ["derive"], optional = true }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
thiserror = "2.0"
axum = { version = "0.8", features = ["ws"], optional = true }
futures = { version = "0.3", optional = true }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"], optional = true }
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", features = ["event-stream"], optional = true }
notify = { version = "6.1", optional = true }
walkdir = { version = "2.5", optional = true }
toml = "0.8"
dirs = "6.0"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rmcp = { version = "1.6.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
agent-client-protocol = { version = "0.11.1", features = ["unstable_session_model"] }
agent-client-protocol-tokio = "0.11.1"
tokio-util = { version = "0.7", features = ["compat"] }
tower-http = { version = "0.6", features = ["cors"], optional = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["signal"] }

[dev-dependencies]
tempfile = "3"
